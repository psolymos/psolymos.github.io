<meta charset="utf-8" />
<title>
  {% if page.title %}{{ page.title | strip_html }} &#8211; {% endif %}{{
  site.title }}
</title>
<meta
  name="description"
  content="{{ page.excerpt | strip_html | normalize_whitespace | truncate: 160 | escape }}"
/>
<meta name="keywords" content="{{ page.tags | join: ', ' }}" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link
  rel="canonical"
  href="{% if page.canonical %}{{ page.canonical }}{% else %}{{ site.baseurl }}{{ page.url }}{% endif %}"
/>
<meta
  property="og:title"
  content="{% if page.title %}{{ page.title | strip_html }} &#8211; {% endif %}{{ site.title }}"
/>
<meta
  property="og:description"
  content="{{ page.excerpt | strip_html | normalize_whitespace | truncate: 160 | escape }}"
/>
<meta
  property="og:image"
  content="{% if page.image %}{{ page.image }}{% else %}{{ site.baseurl }}/images/screenshot.png{% endif %}"
/>
<meta property="og:type" content="website" />
<meta property="og:image:width" content="400" />
<meta property="og:image:height" content="300" />
<meta property="og:url" content="{{ site.baseurl }}{{ page.url }}" />
<meta property="og:site_name" content="{{ site.author_plain }}" />

<script>
  window.MathJax = {
    options: {
      ignoreHtmlClass: "tex2jax_ignore",
      processHtmlClass: "tex2jax_process",
    },
    tex: {
      inlineMath: [
        ["$", "$"],
        ["\\(", "\\)"],
      ],
      autoload: {
        color: [],
        colorV2: ["color"],
      },
      packages: { "[+]": ["noerrors"] },
    },
    loader: {
      load: ["[tex]/noerrors"],
    },
  };
</script>
<script
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
  id="MathJax-script"
></script>
